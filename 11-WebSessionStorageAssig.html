<!DOCTYPE html>
<html>
  <body>
    <h1>Web Storage</h1>
    <h2>Local Storage Assignment</h2>
  </body>
  <script>
    console.log("======== Local Storage ========");

    // Store values
    localStorage.setItem("name", "Name: Shubhangi Jadhav");
    localStorage.setItem("city", "City: Omerga");
    localStorage.setItem("pinCode", "PinCode: 413605");
    localStorage.setItem("district", "District: Dharashiv");

    // Log values before removal
    console.log(localStorage.getItem("name"));
    console.log(localStorage.getItem("city"));
    console.log(localStorage.getItem("pinCode"));
    console.log(localStorage.getItem("district"));

    // Remove city
    localStorage.removeItem("city");

    // Check again after removal
    console.log("After removing city →", localStorage.getItem("city")); // will show null
  </script>
</html>
